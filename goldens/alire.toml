name = "pomarine_goldens"
description = "Golden image checks for tests of what is drawn"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
sdl3 = "*"

[[pins]]
sdl3 = { path = "../sdl3" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"
