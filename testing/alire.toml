name = "pomarine_testing"
description = "Test a Pomarine window offscreen: see it, click on it by name, hear it"
version = "0.1.0-alpha"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
pomarine = "*"

[[pins]]
pomarine = { path = ".." }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"
