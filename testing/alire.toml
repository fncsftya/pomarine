name = "pomarine_testing"
description = "Test a Pomarine window offscreen: see it, click on it by name, hear it"
version = "0.1.0-alpha"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
pomarine_ui = "*"
sdl3 = "*"

[[pins]]
pomarine_ui = { path = "../ui" }
pomarine_vm = { path = "../vm" }
pomarine_model = { path = "../model" }
coretext = { path = "../coretext" }
sdl3 = { path = "../sdl3" }
texts = { path = "../texts" }
typeset = { path = "../typeset" }
yoga = { path = "../yoga" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"
