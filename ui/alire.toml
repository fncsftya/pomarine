name = "pomarine_ui"
description = "UI components above the graphics layers and below the application"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
sdl3 = "*"
texts = "*"
typeset = "*"
yoga = "*"

[[pins]]
coretext = { path = "../coretext" }
sdl3 = { path = "../sdl3" }
texts = { path = "../texts" }
typeset = { path = "../typeset" }
yoga = { path = "../yoga" }

[configuration.variables]
Icon_Capacity = { type = "Integer", first = 16, last = 1024, default = 64 }
Semantic_Value = { type = "Integer", first = 256, last = 65536, default = 4096 }
Semantic_Text = { type = "Integer", first = 32, last = 4096, default = 256 }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"
