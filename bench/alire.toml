name = "bench"
description = "Benchmarks for laying out and drawing long documents"
version = "0.1.0-alpha"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

executables = ["bench", "text_area_bench", "widget_bench", "ui_bench"]

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
pomarine = "*"
pomarine_ui = "*"
coretext = "*"
sdl3 = "*"
texts = "*"
typeset = "*"
yoga = "*"

[[pins]]
pomarine = { path = ".." }
pomarine_ui = { path = "../ui" }
pomarine_vm = { path = "../vm" }
pomarine_model = { path = "../model" }
coretext = { path = "../coretext" }
sdl3 = { path = "../sdl3" }
texts = { path = "../texts" }
typeset = { path = "../typeset" }
yoga = { path = "../yoga" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"
