name = "examples"
description = "Small programs that use Pomarine"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

executables = ["hello_gui", "todo_gui"]

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
pomarine = "*"
pomarine_ui = "*"
coretext = "*"
sdl3 = "*"
texts = "*"
typeset = "*"
yoga = "*"

[[pins]]
pomarine = { path = ".." }
pomarine_ui = { path = "../ui" }
coretext = { path = "../coretext" }
sdl3 = { path = "../sdl3" }
texts = { path = "../texts" }
typeset = { path = "../typeset" }
yoga = { path = "../yoga" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"
