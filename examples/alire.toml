name = "examples"
description = "Small programs that use Pomarine"
version = "0.1.0-alpha"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

executables = ["hello_gui", "todo_gui", "clock_gui", "gallery_gui"]

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
pomarine = "*"

[[pins]]
pomarine = { path = ".." }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"
