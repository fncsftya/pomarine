name = "todo_tests"
description = "Tests for the declarative examples"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

executables = ["todo_vm_test", "todo_view_test", "example_views_test"]

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
pomarine = "*"
pomarine_ui = "*"
pomarine_testing = "*"
pomarine_vm = "*"
coretext = "*"
sdl3 = "*"
texts = "*"
typeset = "*"
yoga = "*"

[[pins]]
pomarine_testing = { path = "../../testing" }
pomarine = { path = "../.." }
pomarine_ui = { path = "../../ui" }
pomarine_vm = { path = "../../vm" }
pomarine_model = { path = "../../model" }
coretext = { path = "../../coretext" }
sdl3 = { path = "../../sdl3" }
texts = { path = "../../texts" }
typeset = { path = "../../typeset" }
yoga = { path = "../../yoga" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"
