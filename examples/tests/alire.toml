name = "todo_tests"
description = "Tests for the declarative examples"
version = "0.1.0-alpha"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

executables = ["todo_vm_test", "todo_view_test", "example_views_test"]

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
pomarine = "*"
pomarine_testing = "*"

[[pins]]
pomarine_testing = { path = "../../testing" }
pomarine = { path = "../.." }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"
