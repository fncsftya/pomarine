name = "pomarine_tests"
description = "Golden-image tests of what pomarine draws"
version = "0.1.0-alpha"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

executables = ["golden"]

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
pomarine = "*"
pomarine_goldens = "*"
pomarine_native = "*"
pomarine_testing = "*"

[[pins]]
pomarine = { path = ".." }
pomarine_goldens = { path = "../goldens" }
pomarine_native = { path = "../native" }
pomarine_testing = { path = "../testing" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"
