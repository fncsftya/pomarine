name = "pomarine_tests"
description = "Golden-image tests of what pomarine draws"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

executables = ["golden"]

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
pomarine = "*"
pomarine_goldens = "*"
pomarine_native = "*"
pomarine_testing = "*"
pomarine_ui = "*"
texts = "*"

[[pins]]
pomarine = { path = ".." }
pomarine_goldens = { path = "../goldens" }
pomarine_native = { path = "../native" }
pomarine_testing = { path = "../testing" }
pomarine_ui = { path = "../ui" }
pomarine_vm = { path = "../vm" }
coretext = { path = "../coretext" }
sdl3 = { path = "../sdl3" }
texts = { path = "../texts" }
typeset = { path = "../typeset" }
yoga = { path = "../yoga" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"
