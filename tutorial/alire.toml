name = "first_app"
description = "Reference implementation for the Pomarine tutorial"
version = "0.1.0-alpha"
licenses = "MIT"
executables = ["first_app", "capture"]

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
pomarine = "*"
pomarine_testing = "*"

[[pins]]
pomarine = { path = ".." }
pomarine_testing = { path = "../testing" }

[build-switches]
"*".ada_version = "Ada2022"
"*".contracts = "Yes"
"*".runtime_checks = "Everything"
